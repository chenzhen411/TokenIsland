name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: ./scripts/test.sh
      - name: Build app
        run: ./scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TokenIsland-macOS
          path: dist/TokenIsland.zip
